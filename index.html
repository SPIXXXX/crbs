<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/crbs/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="crbs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>crbs</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Maps JavaScript API: loaded dynamically from web/api_key.js -->
  <!-- Create web/api_key.js with `window.__MAPS_API_KEY__ = 'YOUR_API_KEY';` and keep it out of source control. -->
  <script src="api_key.js" async></script>
  <script>
    (function loadMaps() {
      try {
        var key = window.__MAPS_API_KEY__ || null;
        if (!key) {
          console.warn('No Maps API key found in web/api_key.js. Create web/api_key.js with window.__MAPS_API_KEY__ = "YOUR_API_KEY"');
          return;
        }
        var s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places';
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      } catch (e) {
        console.warn('Failed to load Google Maps script', e);
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
